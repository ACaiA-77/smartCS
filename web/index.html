<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5f55" />
    <title>SmartCS 智能客服</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#message-input">跳到对话输入</a>
    <section class="login-page" id="login-page" aria-labelledby="login-title">
      <div class="login-brand brand"><span class="brand-mark">S</span><span>SmartCS</span></div>
      <form class="login-form" id="login-form">
        <p class="topbar-kicker">你的智能客服</p>
        <h1 id="login-title">登录后，继续你的咨询</h1>
        <p class="panel-copy">查询自己的订单、处理售后，也可以接着上次的对话聊。</p>
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required maxlength="128" />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p class="auth-message" id="auth-message" role="status">正在检查登录状态…</p>
        <button class="send-button" id="login-button" type="submit" disabled>登录</button>
        <p class="panel-copy">请使用已开通的账户，本页面暂不提供注册。</p>
      </form>
    </section>
    <main class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" aria-label="客服导航">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span>SmartCS</span>
        </div>

        <button class="new-session" id="new-session" type="button" aria-label="新建会话" title="新建会话">
          <i data-lucide="square-pen"></i>
          <span>新建会话</span>
        </button>

        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item" type="button" id="history-button">
            <i data-lucide="history"></i>
            <span>刷新历史会话</span>
          </button>
        </nav>

        <section class="sidebar-section">
          <p class="section-label">历史会话</p>
          <div class="session-list" id="session-list" aria-label="历史会话列表"></div>
        </section>

        <div class="sidebar-footer">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-text">检查服务状态</span>
        </div>
      </aside>

      <section class="conversation-area" aria-label="客服对话">
        <header class="topbar">
          <div>
            <p class="topbar-kicker">SmartCS 智能客服</p>
            <h1 id="session-name">新客服咨询</h1>
          </div>
          <div class="topbar-actions">
            <span class="account-name" id="account-name"></span>
            <button class="text-button" id="logout-button" type="button">退出登录</button>
            <button class="icon-button" id="refresh-orders" type="button" title="刷新我的订单" aria-label="刷新我的订单">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
        </header>

        <div class="conversation-scroll" id="conversation-scroll">
          <section class="welcome-panel" id="welcome-panel">
            <div class="welcome-symbol"><i data-lucide="sparkles"></i></div>
            <div>
              <h2>今天想处理什么问题？</h2>
              <p>可以咨询 Apple 支持知识、查询自己的订单，或创建售后工单。</p>
            </div>
          </section>

          <div class="quick-prompts" aria-label="快捷问题">
            <button type="button" data-prompt="Apple 账户忘记密码怎么恢复？">恢复 Apple 账户</button>
            <button type="button" data-prompt="从 Apple 购买的 App 或内容怎么申请退款？">申请 Apple 购买项目退款</button>
            <button type="button" data-prompt="我要投诉服务问题，请帮我创建工单">创建投诉工单</button>
          </div>

          <div class="message-list" id="message-list" aria-live="polite"></div>
        </div>

        <form class="composer" id="chat-form">
          <label class="sr-only" for="message-input">输入咨询内容</label>
          <textarea id="message-input" rows="1" placeholder="输入问题，例如：查询订单 ORD-20260801-0001"></textarea>
          <button class="send-button" id="send-button" type="submit">
            <span>发送</span>
            <i data-lucide="arrow-up"></i>
          </button>
        </form>
        <p class="composer-hint">会话会自动保存到当前账户。演示订单不代表真实平台数据。</p>
      </section>

      <aside class="context-panel" aria-label="我的订单">
        <section class="context-section">
          <div class="section-heading">
            <div>
              <p class="section-label">当前账户</p>
              <h2>我的订单</h2>
            </div>
            <span class="count-badge" id="order-count"></span>
          </div>
          <p class="panel-copy">选择订单，查看物流、支付与售后进度。</p>
          <div class="order-list" id="order-list">
            <p class="loading-row">正在载入订单...</p>
          </div>
        </section>

        <section class="context-section detail-section" id="order-detail-section">
          <div class="section-heading">
            <div>
              <p class="section-label">最近结果</p>
              <h2>订单详情</h2>
            </div>
            <i data-lucide="package-search" class="heading-icon"></i>
          </div>
          <div class="empty-detail" id="order-detail">
            <i data-lucide="mouse-pointer-click"></i>
            <p>选择你的订单后，详细信息会显示在这里。</p>
          </div>
        </section>

      </aside>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
