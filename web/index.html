<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5f55" />
    <title>SmartCS 客服工作台</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span>SmartCS</span>
        </div>

        <button class="new-session" id="new-session" type="button" aria-label="新建会话" title="新建会话">
          <i data-lucide="square-pen"></i>
          <span>新建会话</span>
        </button>

        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item is-active" type="button" aria-current="page">
            <i data-lucide="messages-square"></i>
            <span>智能客服</span>
          </button>
          <button class="nav-item" type="button" id="history-button">
            <i data-lucide="history"></i>
            <span>当前会话</span>
          </button>
          <a class="nav-item" href="/docs" target="_blank" rel="noreferrer">
            <i data-lucide="braces"></i>
            <span>接口文档</span>
          </a>
        </nav>

        <section class="sidebar-section">
          <p class="section-label">本次会话</p>
          <div class="session-row is-selected">
            <span class="session-dot"></span>
            <span id="session-name">新客服咨询</span>
          </div>
        </section>

        <div class="sidebar-footer">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-text">检查服务状态</span>
        </div>
      </aside>

      <section class="conversation-area" aria-label="客服对话">
        <header class="topbar">
          <div>
            <p class="topbar-kicker">智能客服工作台</p>
            <h1>面向订单、知识与售后的统一对话入口</h1>
          </div>
          <div class="topbar-actions">
            <span class="session-id" id="session-id"></span>
            <button class="icon-button" id="refresh-orders" type="button" title="刷新演示订单" aria-label="刷新演示订单">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
        </header>

        <div class="conversation-scroll" id="conversation-scroll">
          <section class="welcome-panel" id="welcome-panel">
            <div class="welcome-symbol"><i data-lucide="sparkles"></i></div>
            <div>
              <h2>今天想处理什么问题？</h2>
              <p>可以咨询 Apple 支持知识、创建售后工单，或查询本地国内电商演示订单。</p>
            </div>
          </section>

          <div class="quick-prompts" aria-label="快捷问题">
            <button type="button" data-prompt="Apple 账户忘记密码怎么恢复？">恢复 Apple 账户</button>
            <button type="button" data-prompt="从 Apple 购买的 App 或内容怎么申请退款？">申请 Apple 购买项目退款</button>
            <button type="button" data-prompt="我要投诉服务问题，请帮我创建工单">创建投诉工单</button>
            <button type="button" data-order-id="ORD-20260801-0095">查询演示订单</button>
          </div>

          <div class="message-list" id="message-list" aria-live="polite"></div>
        </div>

        <form class="composer" id="chat-form">
          <label class="sr-only" for="message-input">输入咨询内容</label>
          <textarea id="message-input" rows="1" placeholder="输入问题，例如：查询订单 ORD-20260801-0001"></textarea>
          <button class="send-button" id="send-button" type="submit">
            <span>发送</span>
            <i data-lucide="arrow-up"></i>
          </button>
        </form>
        <p class="composer-hint">订单、知识库与工单处理均通过当前会话追踪。演示订单不代表真实平台数据。</p>
      </section>

      <aside class="context-panel" aria-label="会话上下文与订单工具">
        <section class="context-section">
          <div class="section-heading">
            <div>
              <p class="section-label">订单工具</p>
              <h2>演示订单</h2>
            </div>
            <span class="count-badge" id="order-count">100 笔</span>
          </div>
          <p class="panel-copy">点击订单号可直接调用 MCP 订单工具，无需等待大模型路由。</p>
          <div class="order-list" id="order-list">
            <p class="loading-row">正在载入订单...</p>
          </div>
        </section>

        <section class="context-section detail-section" id="order-detail-section">
          <div class="section-heading">
            <div>
              <p class="section-label">最近结果</p>
              <h2>订单详情</h2>
            </div>
            <i data-lucide="package-search" class="heading-icon"></i>
          </div>
          <div class="empty-detail" id="order-detail">
            <i data-lucide="mouse-pointer-click"></i>
            <p>选择一笔演示订单后，物流、支付与售后信息会显示在这里。</p>
          </div>
        </section>

        <section class="tool-status" aria-label="当前处理状态">
          <div class="tool-status-row">
            <i data-lucide="route"></i>
            <span>最近路由</span>
            <strong id="intent-value">等待输入</strong>
          </div>
          <div class="tool-status-row">
            <i data-lucide="shield-check"></i>
            <span>合规检查</span>
            <strong id="compliance-value">未执行</strong>
          </div>
        </section>
      </aside>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
