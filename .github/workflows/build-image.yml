name: Build and publish SmartCS image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartcs_checkpoint
          MYSQL_USER: smartcs
          MYSQL_PASSWORD: smartcs_ci
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      OTEL_SDK_DISABLED: "true"
      EMBEDDING_BACKEND: "hash"
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3307"
      MYSQL_USER: "smartcs"
      MYSQL_PASSWORD: "smartcs_ci"
      MYSQL_DATABASE: "smartcs_checkpoint"
      SMARTCS_TEST_DATABASE: "smartcs_phase1_test"
      SMARTCS_CHECKPOINT_MYSQL_TEST: "1"
      SMARTCS_AUTH_MYSQL_TEST: "1"
      SMARTCS_CONTEXT_REDIS_TEST: "1"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      PYTHON: python
      # CI-only credentials: the Harness integration suites sign and verify real
      # JWTs with both runtimes. Never production values.
      AUTH_JWT_SECRET: "ci-only-auth-jwt-secret-0123456789abcdef"
      INTERNAL_SERVICE_JWT_SECRET: "ci-only-internal-service-secret-0123456789abcdef"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node for cross-service tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-harness/package-lock.json

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Harness dependencies
        working-directory: pi-harness
        run: npm ci --no-audit --no-fund

      - name: Grant test schema access
        run: >-
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e
          "CREATE DATABASE IF NOT EXISTS smartcs_phase1_test;
          GRANT ALL PRIVILEGES ON smartcs_phase1_test.* TO 'smartcs'@'%'; FLUSH PRIVILEGES;"

      - name: Initialize runtime test schema
        env:
          MYSQL_PWD: ${{ env.MYSQL_PASSWORD }}
        run: |
          python -c "import asyncio; from platform_db import PlatformDatabase; asyncio.run(PlatformDatabase.from_env().initialize())"
          for migration in migrations/*.sql; do
            mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" "$MYSQL_DATABASE" < "$migration"
          done

      - name: Check repository readiness
        run: python -m scripts.check_repository_readiness

      - name: Run Python suite
        run: python -m pytest -q -rs --tb=long --junitxml=test-results/python.xml

      - name: Check required integration coverage
        if: ${{ !cancelled() }}
        run: python -m scripts.check_ci_test_results test-results/python.xml

      # These suites reset smartcs_phase1_test. Keep them sequential with pytest.
      - name: Run full Harness suite
        working-directory: pi-harness
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../test-results/harness.xml

      - name: Run offline evaluation
        run: python -m evals.runner --json

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 7

  # A separate fast job proves the offline Harness subset needs neither MySQL
  # nor a Python service. The test job above covers its full integration suite.
  harness:
    name: Run Pi Harness tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pi-harness
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-harness/package-lock.json

      - name: Install dependencies
        # `npm ci`, never `npm install`: the Pi version (1.0.1) and its
        # transitive dependencies are frozen by package-lock.json.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run offline suite
        run: npm run test:ci

  build-and-publish:
    name: Build and publish image
    needs: [test, harness]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
