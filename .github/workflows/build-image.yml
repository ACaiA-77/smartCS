name: Build and publish SmartCS image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OTEL_SDK_DISABLED: "true"
      EMBEDDING_BACKEND: "hash"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check repository readiness
        run: python -m scripts.check_repository_readiness

      - name: Run test suite
        run: python -m pytest -q

      - name: Run offline evaluation
        run: python -m evals.runner --json

  # The repository contains two runtimes, so it needs two jobs. This one covers
  # the Pi Harness (Node 22 / TypeScript). It runs the OFFLINE subset only:
  # `npm test` needs a real MySQL on :3307 and boots the real Python
  # `internal_api`, neither of which exists on a hosted runner. The subset is
  # declared once in pi-harness/vitest.ci.config.ts, where each file's
  # justification lives — so a suite that needs a dependency can never be
  # silently skipped at runtime to make this job green.
  harness:
    name: Run Pi Harness tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pi-harness
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-harness/package-lock.json

      - name: Install dependencies
        # `npm ci`, never `npm install`: the Pi version (1.0.1) and its
        # transitive dependencies are frozen by package-lock.json.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run offline suite
        run: npm run test:ci

  build-and-publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
