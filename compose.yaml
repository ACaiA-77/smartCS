services:
  smartcs-api:
    image: ${SMARTCS_IMAGE:-ghcr.io/acaia-77/smartcs:latest}
    container_name: smartcs-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Phase 7 unified entry: pi sessions are forwarded to the harness service.
      # Grayscale switch stays explicit here; 0 (all legacy) unless overridden.
      PI_HARNESS_BASE_URL: http://smartcs-pi-harness:8971
      SMARTCS_PI_ROLLOUT_PERCENT: "${SMARTCS_PI_ROLLOUT_PERCENT:-0}"
    ports:
      - "${SMARTCS_HOST_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      # Read-only jieba production RAG indexes; RAG_INDEX_ROOT points inside this mount.
      - ./artifacts/rag_jieba:/app/artifacts/rag_jieba:ro
      - smartcs-hf-cache:/home/app/.cache/huggingface
      - smartcs-st-cache:/home/app/.cache/sentence-transformers
    depends_on:
      smartcs-redis:
        condition: service_healthy
    networks:
      - smartcs-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:' + os.getenv('PORT', '8000') + '/health',
          timeout=5
          )
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  smartcs-pi-harness:
    build:
      context: ../pi-harness
      dockerfile: Dockerfile
    image: ${SMARTCS_PI_IMAGE:-smartcs-pi-harness:local}
    container_name: smartcs-pi-harness
    restart: unless-stopped
    # Reuses the runtime's env file for everything both services must agree on
    # (MYSQL_*, model credentials, AUTH_JWT_SECRET, INTERNAL_SERVICE_JWT_SECRET).
    env_file:
      - .env.docker
    environment:
      # `.env.docker` is the API's env file: it also carries PORT/HOST for the
      # Business Runtime, so the harness pins its own explicitly here.
      PORT: "8971"
      HOST: "0.0.0.0"
      # Where the harness finds the Business Runtime — same compose network.
      PYTHON_INTERNAL_BASE_URL: http://smartcs-api:8000
      # Model credentials live in python-impl/.env (the file the process
      # deployment reads). Without it the harness silently falls back to the
      # Faux provider — correct for tests, wrong for a served deployment — so a
      # containerized deployment must point at a real env file.
      SMARTCS_PYTHON_ENV_FILE: /app/runtime-env/.env
      # Read tools (RAG retrieval) need a timeout that matches this deployment's
      # real retrieval latency; see PHASE9_REPORT.md.
      SMARTCS_TOOL_TIMEOUT_MS: "${SMARTCS_TOOL_TIMEOUT_MS:-90000}"
      SMARTCS_SKILLS: "${SMARTCS_SKILLS:-on}"
      SMARTCS_WRITE_MODE: "${SMARTCS_WRITE_MODE:-live}"
    ports:
      # Internal-only in production; published on loopback for local inspection.
      - "127.0.0.1:${SMARTCS_PI_HOST_PORT:-8971}:8971"
    volumes:
      # Durable Pi transcripts + runtime dirs. Losing this loses conversation
      # history; it is the one stateful thing this container owns.
      - smartcs-pi-runtime:/app/.runtime
      # Read-only: the shared env file both runtimes already treat as the source
      # of model credentials. Override with SMARTCS_ENV_FILE_HOST for a real
      # deployment (or bake credentials in another way).
      - ${SMARTCS_ENV_FILE_HOST:-../python-impl/.env}:/app/runtime-env/.env:ro
    depends_on:
      smartcs-api:
        condition: service_started
    networks:
      - smartcs-net

  smartcs-redis:
    image: redis:7-alpine
    container_name: smartcs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - smartcs-redis-data:/data
    networks:
      - smartcs-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: containrrr/watchtower:latest
    container_name: smartcs-watchtower
    restart: unless-stopped
    profiles:
      - auto-update
    command: --interval 300 --cleanup smartcs-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  smartcs-net:
    name: smartcs-net
    external: true

volumes:
  smartcs-pi-runtime:
  smartcs-hf-cache:
  smartcs-st-cache:
  smartcs-redis-data:
